services:
  backend:
    build: ./backend
    # For pushing on DockerHub: need DockerHub username & repo name
    image: docker4adwait/cryptoplatform-backend:latest

    container_name: backend-api
    ports:
      - "8080:8080"
    environment:
      # SPRING_PROFILE decides which application-{profile}.properties
      # file Spring Boot loads. Switch dev <-> prod purely via .env, no changes needed here.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE}

      # In dev, DB_URL points to H2 in-memory. In prod, it points to Aiven MySQL.
      # Same variable name either way - only the value in .env changes.
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET_KEY: ${JWT_CODE}
      PROD_CORS_ORIGINS: ${CORS_ORIGINS}

      STRIPE_API_KEY: ${STRIPE_KEY}
      RAZORPAY_API_KEY: ${RAZORPAY_KEY}
      RAZORPAY_SECRET_KEY: ${RAZORPAY_SECRET}

      GEMINI_API_KEY: ${GEMINI_KEY}
      COINGECKO_API_KEY: ${COINGECKO_KEY}

      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${BACKEND_URL}

    # For pushing on DockerHub: need DockerHub username & repo name
    image: docker4adwait/cryptoplatform-frontend:latest

    container_name: frontend-ui
    ports:
      - "5173:80"
    depends_on:
      - backend
