
app.cors.allowed-origins=${PROD_CORS_ORIGINS}

# JWT Secret for JSON token verification
jwt.secret=${JWT_SECRET_KEY}

###### Connect app to database :- ######

# ___URL contains -
# ___DB type : mysql
# ___DB host : aiven-db-first.....aivencloud.com
# ___DB port no. : 18..
# ___DB name : cr..
spring.datasource.url=${db_URL}
spring.datasource.username=${db_USERNAME}
spring.datasource.password=${db_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

###### JPA and Hibernate config (while handling database) :- ######

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

###### API keys :- ######

# ___for Payment -
stripe.api.key=${STRIPE_API_KEY}
razorpay.api.key=${RAZORPAY_API_KEY}
razorpay.api.secret=${RAZORPAY_SECRET_KEY}

# ___for Crypto monitoring -
coingecko.api.key=${COIN-GECKO_API_KEY}

# ___for Chatbot assistant -
gemini.api.key=${GEMINI_API_KEY}

####### Java mail service (using Gmail SMTP) :- ######

# ___SMTP Host (e.g. Gmail)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}

# ___email credentials
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true