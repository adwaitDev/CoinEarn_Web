server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # This is the important part for a React SPA:
    # any unknown path falls back to index.html so client-side
    # routing (React Router) works on hard refresh / direct links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}